<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <title>graip | movies</title>
    <link rel="icon" href="/assets/img/fav.png?v=12">
    <link rel="stylesheet" href="/assets/css/colors.css" id="css-theme-link">
    <script src="/assets/js/colors.js"></script>
    <link rel="stylesheet" href="/assets/css/font.css">
    <link rel="stylesheet" href="/assets/icons/fonts/remixicon.css">
    <link rel="manifest" href="/manifest.json">
    <script src="/assets/js/log.js"></script>
    <script src="/assets/js/cloak.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        html, body { min-height: 100%; margin: 0; background: transparent; color: var(--text); }
        body { overflow-x: hidden; font-family: Arial, sans-serif; }
        .movies-page { width: min(100%, 980px); min-height: 100vh; margin: 0 auto; padding: 30px 24px 32px; }
        .movies-page h1 { margin: 0 0 20px; color: var(--bright-text); text-align: center; font-size: clamp(26px, 5vw, 36px); font-weight: 600; }
        .movie-controls { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 20px; }
        .movie-search { width: min(100%, 520px); height: 46px; padding: 0 18px; border: 1px solid color-mix(in srgb, var(--text) 18%, transparent); border-radius: 16px; outline: none; color: var(--text); background: var(--bg-2); font-size: 15px; }
        .movie-search:focus { border-color: var(--accent); background: var(--bg-3); }
        .movie-tabs { display: flex; justify-content: center; gap: 8px; }
        .movie-tabs button, .movie-pagination button { min-height: 40px; padding: 0 17px; border: 0; border-radius: 14px; color: var(--text); background: var(--bg-2); cursor: pointer; font-size: 14px; }
        .movie-tabs button[aria-pressed="true"] { color: white; background: var(--accent); }
        .movie-status { min-height: 24px; margin: 4px 0 14px; text-align: center; font-size: 14px; opacity: .82; }
        .movie-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
        .movie-card { position: relative; display: block; overflow: hidden; aspect-ratio: 2 / 3; border-radius: 20px; background: var(--bg-2); text-decoration: none; }
        .movie-card img { display: block; width: 100%; height: 100%; object-fit: cover; }
        .movie-card span { position: absolute; inset: auto 0 0; padding: 28px 10px 10px; color: white; background: linear-gradient(transparent, rgba(0,0,0,.82)); font-size: 13px; font-weight: 600; opacity: 0; transition: opacity .16s ease; }
        .movie-card:hover span, .movie-card:focus-visible span { opacity: 1; }
        .movie-pagination { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 22px auto 0; }
        .movie-pagination button:disabled { opacity: .45; cursor: default; }
        .movie-page-number { min-width: 80px; text-align: center; font-size: 14px; }
        @media (max-width: 640px) {
            .movies-page { padding: 16px 16px 28px; }
            .movies-page h1 { margin: 0 0 16px; font-size: 28px; }
            .movie-controls { gap: 10px; margin-bottom: 12px; }
            .movie-search { width: 100%; height: 42px; }
            .movie-tabs { width: 100%; }
            .movie-tabs button { flex: 0 1 auto; min-height: 38px; }
            .movie-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
            .movie-card { border-radius: 17px; }
            .movie-card span { opacity: 1; font-size: 12px; }
            .movie-pagination { gap: 6px; }
            .movie-pagination button { padding: 0 12px; }
        }
    </style>
</head>
<body>
    <main class="movies-page">
        <h1>graip | movies</h1>
        <div class="movie-controls">
            <input id="movie-search" class="movie-search" type="search" autocomplete="off" placeholder="What are we watching today?" aria-label="Search movies and shows">
            <div class="movie-tabs" role="group" aria-label="Choose movies or TV shows">
                <button type="button" data-kind="movies" aria-pressed="true">Movies</button>
                <button type="button" data-kind="shows" aria-pressed="false">TV and shows</button>
            </div>
        </div>
        <p class="movie-status" id="movie-status" role="status" aria-live="polite">Loading movies…</p>
        <div class="movie-grid" id="movie-grid"></div>
        <div class="movie-pagination">
            <button type="button" id="movie-previous" disabled>Previous</button>
            <span class="movie-page-number">Page <span id="movie-page">1</span></span>
            <button type="button" id="movie-next">Next</button>
        </div>
    </main>
    <script>
        (() => {
            const apiKey = 'fb7bb23f03b6994dafc674c074d01761'
            const grid = document.getElementById('movie-grid')
            const status = document.getElementById('movie-status')
            const search = document.getElementById('movie-search')
            const pageLabel = document.getElementById('movie-page')
            const previous = document.getElementById('movie-previous')
            const next = document.getElementById('movie-next')
            const tabs = [...document.querySelectorAll('[data-kind]')]
            let kind = 'movies'
            let page = 1
            let requestId = 0
            let debounceTimer

            async function loadContent() {
                const thisRequest = ++requestId
                const query = search.value.trim()
                const endpoint = query
                    ? `search/${kind === 'movies' ? 'movie' : 'tv'}`
                    : `${kind === 'movies' ? 'movie/popular' : 'tv/popular'}`
                const params = new URLSearchParams({ api_key: apiKey, page: String(page) })
                if (query) params.set('query', query)
                const controller = new AbortController()
                const timeout = setTimeout(() => controller.abort(), 12000)
                status.textContent = 'Loading…'
                grid.replaceChildren()
                try {
                    const response = await fetch(`https://api.themoviedb.org/3/${endpoint}?${params}`, {
                        headers: { Accept: 'application/json' }, signal: controller.signal
                    })
                    if (!response.ok) throw new Error(`HTTP ${response.status}`)
                    const data = await response.json()
                    if (thisRequest !== requestId) return
                    const items = Array.isArray(data.results) ? data.results : []
                    for (const item of items) {
                        if (!item.poster_path) continue
                        const title = item.title || item.name || 'Untitled'
                        const card = document.createElement('a')
                        card.className = 'movie-card'
                        card.href = `watch.html?id=${encodeURIComponent(item.id)}&type=${kind === 'movies' ? 'movie' : 'tv'}`
                        const image = document.createElement('img')
                        image.src = `https://image.tmdb.org/t/p/w500${item.poster_path}`
                        image.alt = title
                        image.loading = 'lazy'
                        const caption = document.createElement('span')
                        caption.textContent = title
                        card.append(image, caption)
                        grid.append(card)
                    }
                    status.textContent = grid.childElementCount ? '' : 'No results found.'
                    pageLabel.textContent = String(page)
                    previous.disabled = page <= 1
                    window.GraipLog && window.GraipLog.action('movies', 'load catalog page', { kind, page })
                } catch (error) {
                    if (thisRequest !== requestId) return
                    status.textContent = error.name === 'AbortError'
                        ? 'The movie service took too long to respond. Please try again.'
                        : 'Could not reach TMDb. A network filter may be blocking it — try again through the proxy.'
                    previous.disabled = page <= 1
                } finally {
                    clearTimeout(timeout)
                }
            }

            grid.addEventListener('click', event => {
                if (event.target.closest('.movie-card')) {
                    window.GraipLog && window.GraipLog.action('movies', 'open movie detail')
                }
            })
            tabs.forEach(button => button.addEventListener('click', () => {
                kind = button.dataset.kind
                page = 1
                tabs.forEach(tab => tab.setAttribute('aria-pressed', String(tab === button)))
                loadContent()
            }))
            search.addEventListener('input', () => {
                page = 1
                clearTimeout(debounceTimer)
                debounceTimer = setTimeout(loadContent, 300)
            })
            previous.addEventListener('click', () => { if (page > 1) { page--; loadContent() } })
            next.addEventListener('click', () => { page++; loadContent() })
            loadContent()
        })()
    </script>
</body>
</html>
